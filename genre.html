<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genre Anime — Rofpedia</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🟢</text></svg>">
  <style>
    .genre-list-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
      padding: 0 var(--content-px);
      margin-bottom: 48px;
    }
    .genre-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 20px 16px;
      cursor: pointer;
      transition: all var(--t-fast);
      text-align: center;
    }
    .genre-card:hover {
      border-color: var(--green-primary);
      background: var(--green-glow);
      transform: translateY(-2px);
    }
    .genre-card.active {
      border-color: var(--green-primary);
      background: var(--green-primary);
    }
    .genre-card.active .genre-card-name { color: #000; }
    .genre-card-icon { font-size: 28px; margin-bottom: 8px; }
    .genre-card-name {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-primary);
    }
    .genre-results-header {
      padding: 0 var(--content-px) 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .genre-results-title {
      font-size: 18px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 10px;
    }
  </style>
</head>
<body>

<nav class="navbar scrolled" id="navbar">
  <a href="../index.html" class="nav-logo">
    <div class="logo-dot"></div>Rof<span class="accent">pedia</span>
  </a>
  <ul class="nav-links">
    <li><a href="../index.html">Beranda</a></li>
    <li><a href="ongoing.html">Ongoing</a></li>
    <li><a href="complete.html">Tamat</a></li>
    <li><a href="schedule.html">Jadwal</a></li>
    <li><a href="az.html">A–Z</a></li>
  </ul>
  <div class="nav-right">
    <div class="api-status" id="apiStatus">
      <div class="api-dot" id="apiDot"></div>
      <span id="apiStatusText">Connecting…</span>
    </div>
    <div class="search-bar">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input type="text" id="searchInput" placeholder="Cari anime…" autocomplete="off">
    </div>
    <a href="../index.html" class="btn btn-green btn-sm">Beranda</a>
  </div>
</nav>

<div class="search-panel" id="searchPanel"></div>

<div style="padding: calc(var(--nav-h) + 40px) var(--content-px) 28px;">
  <h1 style="font-size:28px;font-weight:900;letter-spacing:-0.8px;margin-bottom:8px;display:flex;align-items:center;gap:12px;">
    <span style="width:4px;height:28px;background:var(--green-primary);border-radius:2px;display:inline-block;flex-shrink:0"></span>
    Jelajah Genre
  </h1>
  <p style="color:var(--text-muted);font-size:14px;margin-bottom:28px;">Pilih genre untuk menelusuri koleksi anime.</p>
</div>

<!-- Genre cards grid -->
<div class="genre-list-grid" id="genreGrid">
  ${Array.from({length:12}).map(()=>`
    <div class="skeleton" style="height:90px;border-radius:var(--radius-md)"></div>
  `).join('')}
</div>

<!-- Results -->
<div id="resultsSection" style="display:none;">
  <div class="genre-results-header">
    <div class="genre-results-title">
      <span class="bar" style="width:3px;height:20px;background:var(--green-primary);border-radius:2px;display:inline-block"></span>
      <span id="resultsTitle">Hasil</span>
    </div>
    <div style="font-size:13px;color:var(--text-muted)">Halaman <span id="pageLabel">1</span></div>
  </div>
  <div style="padding:0 var(--content-px);">
    <div class="anime-grid" id="resultsGrid"></div>
    <div id="resultsPagination" style="margin-top:8px;"></div>
  </div>
</div>

<div style="height:60px;"></div>

<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)App.closeModal()">
  <div class="modal" id="modal"></div>
</div>
<div class="player-overlay" id="playerOverlay">
  <div class="player-topbar">
    <div class="player-title" id="playerTitle">Memuat…</div>
    <button class="btn btn-icon" onclick="App.closePlayer()">✕</button>
  </div>
  <iframe id="playerFrame" class="player-frame" allowfullscreen allow="autoplay;fullscreen" src="about:blank"></iframe>
  <div class="player-controls">
    <div class="player-nav-btns">
      <button class="btn btn-ghost btn-sm" id="playerPrev" style="display:none">‹ Sebelumnya</button>
      <button class="btn btn-ghost btn-sm" id="playerNext" style="display:none">Berikutnya ›</button>
    </div>
    <div class="player-quality-btns" id="playerQuality"></div>
    <div class="player-download">
      <button class="btn btn-outline btn-sm" onclick="App.toggleDownloads()">⬇ Download</button>
    </div>
  </div>
  <div class="dl-panel" id="dlPanel"></div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
  import * as API from '../js/api.js';
  import * as UI  from '../js/ui.js';
  import { makeCard, makeSearchResult } from '../js/cards.js';

  const GENRE_ICONS = {
    'Action':'⚔️','Adventure':'🗺️','Comedy':'😂','Drama':'🎭',
    'Fantasy':'🧙','Horror':'👻','Mystery':'🔍','Romance':'💕',
    'Sci-Fi':'🚀','Slice of Life':'☕','Sports':'⚽','Supernatural':'✨',
    'Thriller':'😱','Mecha':'🤖','Isekai':'🌀','School':'🏫',
    'Shounen':'💥','Shoujo':'🌸','Seinen':'🗡️','Josei':'💄',
    'Music':'🎵','Historical':'🏛️','Military':'🪖','Psychological':'🧠',
  };

  const state = { slug: '', name: '', page: 1, total: 1 };

  async function init() {
    const health = await API.checkHealth();
    const dot = document.getElementById('apiDot');
    const txt = document.getElementById('apiStatusText');
    if (health.success) { dot.classList.add('online'); txt.textContent = 'Online'; }
    else { dot.classList.add('offline'); txt.textContent = 'Offline'; }

    const res = await API.getGenres();
    const grid = document.getElementById('genreGrid');

    if (!res.success || !res.data?.length) {
      grid.innerHTML = UI.errorState(res.error?.message);
      return;
    }

    grid.innerHTML = res.data.map(g => {
      const icon = GENRE_ICONS[g.name] || '🎬';
      return `
        <div class="genre-card" data-slug="${g.slug}" onclick="selectGenre('${g.slug}','${g.name}')">
          <div class="genre-card-icon">${icon}</div>
          <div class="genre-card-name">${g.name}</div>
        </div>`;
    }).join('');

    // check URL params
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('slug');
    const name = params.get('name');
    if (slug) selectGenre(slug, name || slug);
  }

  window.selectGenre = async function(slug, name) {
    state.slug = slug;
    state.name = name;
    state.page = 1;

    document.querySelectorAll('.genre-card').forEach(c => {
      c.classList.toggle('active', c.dataset.slug === slug);
    });

    document.getElementById('resultsTitle').textContent = name;
    document.getElementById('resultsSection').style.display = '';
    document.getElementById('resultsSection').scrollIntoView({ behavior: 'smooth', block: 'start' });

    await loadPage(slug, 1);
  };

  async function loadPage(slug, page) {
    state.page = page;
    document.getElementById('pageLabel').textContent = page;
    UI.renderSkeletonGrid('resultsGrid', 18);

    const res = await API.getGenreAnime(slug, page);
    const grid = document.getElementById('resultsGrid');

    if (!res.success) { grid.innerHTML = UI.errorState(res.error?.message); return; }

    const items = (res.data?.anime || []).map(a => ({
      title: a.title, url: a.url, poster: a.poster,
      episode: a.episode, day_or_rating: a.rating,
    }));

    if (!items.length) { grid.innerHTML = UI.emptyState(); return; }
    grid.innerHTML = items.map(makeCard).join('');

    const pg = res.data?.pagination;
    if (pg) {
      state.total = pg.total_pages;
      document.getElementById('resultsPagination').innerHTML =
        UI.buildPagination(pg.current_page, pg.total_pages, p => loadPage(slug, p));
    }
  }

  // search
  const searchInput = document.getElementById('searchInput');
  const panel       = document.getElementById('searchPanel');
  let timer;
  searchInput?.addEventListener('input', e => {
    clearTimeout(timer);
    const q = e.target.value.trim();
    if (!q) { panel.classList.remove('open'); return; }
    timer = setTimeout(async () => {
      const res = await API.searchAnime(q);
      panel.innerHTML = (res.data||[]).length
        ? (res.data||[]).map(makeSearchResult).join('')
        : '<div class="search-empty">Tidak ditemukan.</div>';
      panel.classList.add('open');
    }, 480);
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#searchPanel') && !e.target.closest('.search-bar'))
      panel.classList.remove('open');
  });

  init();
</script>
</body>
</html>
