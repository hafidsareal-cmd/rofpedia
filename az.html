<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Anime A–Z — Rofpedia</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🟢</text></svg>">
  <style>
    .az-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 var(--content-px) 28px;
    }
    .az-letter-btn {
      width: 38px; height: 38px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all var(--t-fast);
      font-family: inherit;
    }
    .az-letter-btn:hover,
    .az-letter-btn.active {
      background: var(--green-primary);
      border-color: var(--green-primary);
      color: #000;
    }
    .az-section { margin-bottom: 36px; padding: 0 var(--content-px); }
    .az-section-letter {
      font-size: 22px;
      font-weight: 900;
      color: var(--green-primary);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .az-section-letter::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .az-anime-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 8px;
    }
    .az-anime-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 14px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all var(--t-fast);
      text-decoration: none;
    }
    .az-anime-item:hover {
      border-color: var(--green-primary);
      background: var(--green-glow);
    }
    .az-anime-item:hover .az-anime-name { color: var(--green-primary); }
    .az-anime-bullet {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--green-dim);
      flex-shrink: 0;
    }
    .az-anime-name {
      font-size: 13px;
      color: var(--text-secondary);
      transition: color var(--t-fast);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>
</head>
<body>

<nav class="navbar scrolled" id="navbar">
  <a href="../index.html" class="nav-logo">
    <div class="logo-dot"></div>Rof<span class="accent">pedia</span>
  </a>
  <ul class="nav-links">
    <li><a href="../index.html">Beranda</a></li>
    <li><a href="ongoing.html">Ongoing</a></li>
    <li><a href="complete.html">Tamat</a></li>
    <li><a href="schedule.html">Jadwal</a></li>
    <li><a href="az.html" class="active">A–Z</a></li>
  </ul>
  <div class="nav-right">
    <div class="api-status" id="apiStatus">
      <div class="api-dot" id="apiDot"></div>
      <span id="apiStatusText">Connecting…</span>
    </div>
    <div class="search-bar">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input type="text" id="searchInput" placeholder="Cari anime…" autocomplete="off">
    </div>
    <a href="../index.html" class="btn btn-green btn-sm">Beranda</a>
  </div>
</nav>

<div class="search-panel" id="searchPanel"></div>

<div style="padding: calc(var(--nav-h) + 40px) var(--content-px) 24px;">
  <h1 style="font-size:28px;font-weight:900;letter-spacing:-0.8px;margin-bottom:8px;display:flex;align-items:center;gap:12px;">
    <span style="width:4px;height:28px;background:var(--green-primary);border-radius:2px;display:inline-block;flex-shrink:0"></span>
    Daftar Anime A–Z
  </h1>
  <p style="color:var(--text-muted);font-size:14px;margin-bottom:28px;">Semua anime berurutan secara alfabet.</p>

  <!-- Letter jump nav -->
  <div class="az-nav" id="azNav">
    <div class="skeleton skel-line" style="width:100%;height:38px;border-radius:var(--radius-sm)"></div>
  </div>
</div>

<!-- Content -->
<div id="azContent">
  <div class="page-loader"><div class="spinner"></div></div>
</div>

<div style="height:60px;"></div>

<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)App.closeModal()">
  <div class="modal" id="modal"></div>
</div>
<div class="player-overlay" id="playerOverlay">
  <div class="player-topbar">
    <div class="player-title" id="playerTitle">Memuat…</div>
    <button class="btn btn-icon" onclick="App.closePlayer()">✕</button>
  </div>
  <iframe id="playerFrame" class="player-frame" allowfullscreen allow="autoplay;fullscreen" src="about:blank"></iframe>
  <div class="player-controls">
    <div class="player-nav-btns">
      <button class="btn btn-ghost btn-sm" id="playerPrev" style="display:none">‹ Sebelumnya</button>
      <button class="btn btn-ghost btn-sm" id="playerNext" style="display:none">Berikutnya ›</button>
    </div>
    <div class="player-quality-btns" id="playerQuality"></div>
    <div class="player-download">
      <button class="btn btn-outline btn-sm" onclick="App.toggleDownloads()">⬇ Download</button>
    </div>
  </div>
  <div class="dl-panel" id="dlPanel"></div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
  import * as API from '../js/api.js';
  import * as UI  from '../js/ui.js';
  import { makeSearchResult } from '../js/cards.js';

  async function load() {
    const health = await API.checkHealth();
    const dot = document.getElementById('apiDot');
    const txt = document.getElementById('apiStatusText');
    if (health.success) { dot.classList.add('online'); txt.textContent = 'Online'; }
    else { dot.classList.add('offline'); txt.textContent = 'Offline'; }

    const res = await API.getAZ();
    const nav     = document.getElementById('azNav');
    const content = document.getElementById('azContent');

    if (!res.success || !res.data?.length) {
      nav.innerHTML     = '';
      content.innerHTML = UI.errorState(res.error?.message);
      return;
    }

    const groups = res.data;

    // Build letter jump nav
    nav.innerHTML = groups.map(g =>
      `<button class="az-letter-btn" onclick="jumpTo('${g.letter}')">${g.letter}</button>`
    ).join('');

    // Build sections
    content.innerHTML = groups.map(g => {
      const items = (g.anime || []).map(a => `
        <div class="az-anime-item"
             onclick="openDetail('${encodeURIComponent(a.url)}','${encodeURIComponent(a.title)}')">
          <span class="az-anime-bullet"></span>
          <span class="az-anime-name" title="${a.title}">${a.title}</span>
        </div>`).join('');

      return `
        <div class="az-section" id="az-${g.letter}">
          <div class="az-section-letter">${g.letter}</div>
          <div class="az-anime-list">${items || '<div style="color:var(--text-muted);font-size:13px">Tidak ada.</div>'}</div>
        </div>`;
    }).join('');
  }

  window.jumpTo = function(letter) {
    document.querySelectorAll('.az-letter-btn').forEach(b => b.classList.remove('active'));
    const btn = [...document.querySelectorAll('.az-letter-btn')].find(b => b.textContent === letter);
    btn?.classList.add('active');
    document.getElementById(`az-${letter}`)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  };

  window.openDetail = function(encURL, encTitle) {
    window.location.href = `../index.html#anime=${encURL}&title=${encTitle}`;
  };

  // search
  const searchInput = document.getElementById('searchInput');
  const panel       = document.getElementById('searchPanel');
  let timer;
  searchInput?.addEventListener('input', e => {
    clearTimeout(timer);
    const q = e.target.value.trim();
    if (!q) { panel.classList.remove('open'); return; }
    timer = setTimeout(async () => {
      const res = await API.searchAnime(q);
      const results = res.data || [];
      panel.innerHTML = results.length
        ? results.map(makeSearchResult).join('')
        : '<div class="search-empty">Tidak ditemukan.</div>';
      panel.classList.add('open');
    }, 480);
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#searchPanel') && !e.target.closest('.search-bar'))
      panel.classList.remove('open');
  });

  load();
</script>
</body>
</html>
